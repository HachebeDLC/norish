# Test the locally-built Docker image with full infrastructure.
# Usage:
#   1. Build the image first:  docker build -f docker/Dockerfile -t norish:local .
#   2. Run everything:         docker compose -f docker/docker-compose.test.yml up
#   3. Open:                   http://localhost:8453
#   4. Stop:                   docker compose -f docker/docker-compose.test.yml down

services:
  norish:
    image: norish:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: norish-app-test
    restart: unless-stopped
    ports:
      - "8453:8453"
    volumes:
      - norish_uploads:/app/uploads
      - ../../tags.json:/app/tags.json
    environment:
      DATABASE_URL: postgres://postgres:norish@db:5432/norish
      REDIS_URL: redis://redis:6379
      AUTH_URL: https://norish.artemisa-hb.cloud/
      PORT: 8453
      TRUSTED_ORIGINS: https://norish.artemisa-hb.cloud/, http://localhost:8453,http://192.168.*.*:8453,exp://,exp://**,exp://192.168.*.*:*/**
      MASTER_KEY: X4fjLgB8egCPwlOQW8iC3JGXAtUIMUOGmk/y29n+YSw=
      CHROME_WS_ENDPOINT: ws://chrome-headless:3000
      PASSWORD_AUTH_ENABLED: "true"
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chrome-headless:
        condition: service_started

  norish-worker:
    image: norish:local
    container_name: norish-worker-test
    restart: unless-stopped
    command: ["node", "dist-server/worker.mjs"]
    volumes:
      - norish_uploads:/app/uploads
      - ../../tags.json:/app/tags.json
    environment:
      DATABASE_URL: postgres://postgres:norish@db:5432/norish
      REDIS_URL: redis://redis:6379
      MASTER_KEY: X4fjLgB8egCPwlOQW8iC3JGXAtUIMUOGmk/y29n+YSw=
      CHROME_WS_ENDPOINT: ws://chrome-headless:3000
      LOG_LEVEL: debug
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chrome-headless:
        condition: service_started

  # Scheduler for HelloFresh sync
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: norish-ofelia-test
    depends_on:
      - norish
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.job-exec.hellofresh-sync.schedule: "@weekly"
      ofelia.job-exec.hellofresh-sync.container: "norish-worker-test"
      ofelia.job-exec.hellofresh-sync.command: "node /app/dist-server/cli.mjs hf-sync ES es-ES"
      ofelia.job-exec.hellofresh-repair-images.schedule: "@weekly"
      ofelia.job-exec.hellofresh-repair-images.container: "norish-worker-test"
      ofelia.job-exec.hellofresh-repair-images.command: "node /app/dist-server/cli.mjs hf-repair-images"
      ofelia.job-exec.hellofresh-sync-tags.schedule: "@weekly"
      ofelia.job-exec.hellofresh-sync-tags.container: "norish-worker-test"
      ofelia.job-exec.hellofresh-sync-tags.command: "node /app/dist-server/cli.mjs hf-sync-tags"
      ofelia.job-exec.hellofresh-categorize-tags.schedule: "@daily"
      ofelia.job-exec.hellofresh-categorize-tags.container: "norish-worker-test"
      ofelia.job-exec.hellofresh-categorize-tags.command: "node /app/dist-server/cli.mjs hf-categorize-tags"

  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    container_name: norish-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: norish
      POSTGRES_DB: norish
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Headless Chrome for recipe scraping
  chrome-headless:
    image: zenika/alpine-chrome:latest
    container_name: chrome-headless-test
    restart: unless-stopped
    command:
      - "--no-sandbox"
      - "--disable-gpu"
      - "--disable-dev-shm-usage"
      - "--disable-features=dbus"
      - "--remote-debugging-address=0.0.0.0"
      - "--remote-debugging-port=3000"
      - "--headless"

  # Redis for real-time events
  redis:
    image: redis:8.6.0
    container_name: norish-redis-test
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  norish_uploads:
  redis_data:
